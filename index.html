## 一句话总结
StreamingVLM 的核心不是单点技巧，而是把 **训练方式、推理缓存结构、位置编码和数据集** 对齐成一套流式系统：训练时用短且重叠的视频块做全注意力 SFT；推理时保留 attention sink、近期文本窗口和近期视觉窗口，并复用 KV cache；再用 contiguous RoPE 避免位置编号无限增长。

## 论文信息
- **标题**：StreamingVLM: Real-Time Understanding for Infinite Video Streams
- **作者**：Ruyi Xu, Guangxuan Xiao, Yukang Chen, Liuning He, Yao Lu, Song Han
- **机构**：MIT, NVIDIA
- **会议**：ICLR 2026
- **链接**：[arXiv:2510.09608](https://arxiv.org/abs/2510.09608) · [项目代码](https://github.com/mit-han-lab/streaming-vlm)

## 背景：为什么长视频流很难？
现有 VLM 面对实时视频流时通常遇到三类问题：

- **Full Attention 成本失控**：视频越长，注意力开销近似按 O(T²) 增长，显存和延迟都不可接受，并且超过训练长度后性能下降。
- **无重叠 Sliding Window 破坏连贯性**：每个窗口像独立片段，历史语义容易断裂；窗口过长又会造成延迟。
- **有重叠 Sliding Window 重算严重**：能保留部分上下文，但大量重复计算导致实时性差。

  <figcaption>图 1：StreamingVLM 与既有方案对比。它通过 Sliding Window + Reuse KV 复用 attention sink、短视觉窗口和长文本窗口，从而兼顾历史、低延迟与稳定性。</figcaption>

## 方法：训练-推理一致的流式框架
### 1. Streaming-aware KV Cache
推理时，模型维护一个紧凑 KV cache，主要保留三部分：

- **Attention sink tokens**：系统提示和早期关键文本 token，用于稳定注意力。
- **Long text window**：较长的近期文本窗口，保留对话和解说历史。
- **Short vision window**：较短的近期视觉 token 窗口，跟踪正在发生的动作。

这种非对称策略很符合视频流特点：视觉画面变化快，旧视觉 token 可以先淘汰；文本承载长期语义、人物、比分和上下文，需要保留更久。

<figure class="figure">
  <img src="assets/papers/streamingvlm/x3.png" alt="StreamingVLM 推理结构" loading="lazy" />
  <figcaption>图 3：推理时保留 512 个 attention-sink token、512 个近期文本 token，以及覆盖 16 秒的近期视觉 token。</figcaption>
</figure>

### 2. Contiguous RoPE
如果简单丢弃旧 token，剩余 token 的 RoPE 位置编号会持续增长，最后落到训练分布之外。StreamingVLM 在淘汰 token 后将位置编号左移，让保留 token 和新 token 的位置保持连续且有界。

对 Qwen-VL 这类使用 3D 位置编码的模型，论文也把 contiguous RoPE 扩展到视觉 token 的时间、高度、宽度维度。

### 3. Overlapped-chunk Full-attention SFT
训练阶段不直接训练超长视频，而是把长视频切成长度 W 的短 chunk，相邻 chunk 有 O 帧重叠，并在每个 chunk 内使用 full attention。

这个设计很关键：虽然训练时看的是短片段，但重叠区域让训练样本近似模拟推理时的 “sink + 近期文本 + 近期视觉” 注意力模式，从而实现 **训练-推理一致**。

## 数据：Inf-Streams-Train 与 Inf-Streams-Eval
论文围绕体育解说构建数据，因为体育赛事天然具备长视频、实时动作、强时序和密集解说的特点。

### 数据清洗流程
- 收集篮球、足球、美式橄榄球、冰球、棒球五类比赛视频。
- 使用 WhisperX 获取带时间戳 ASR。
- 将视频切成 120 秒片段，用 GPT-5 判断每句解说应该 keep、edit 还是 delete。
- 原始 ASR 中约 46.32% 保留，37.89% 编辑，15.79% 删除。

### 训练与评测数据
- **SFT 数据**：以 W=24s、O=12s 切分，构成 525K streaming samples。
- **高质量 annealing 数据**：保留实时场上动作占比超过 80% 的片段，最终 14,786 条。
- **Inf-Streams-Eval**：20 场完整比赛，平均 2.12 小时，按 100 秒片段评估，使用 GPT-5 基于参考解说进行 pairwise vote。

### Efficiency：延迟稳定，支持实时
Full attention 会随视频变长不断变慢甚至 OOM；普通 sliding window 会周期性重建上下文或重复计算。StreamingVLM 由于固定缓存长度并复用 KV，per-token latency 基本稳定，可在单张 H100 上以 8 FPS 支持实时解说。

## Ablation：哪些设计最关键？
### Contiguous RoPE
Native RoPE 在无限流上性能明显下降，因为位置编号不断外推；contiguous RoPE 让位置保持在训练分布内，Inf-Streams-Eval 对 GPT-4o mini 的胜率从 25.09 提升到 66.18。

### 视觉窗口与文本窗口
- 0 秒视觉窗口明显下降，说明近期视觉上下文对连续动作非常重要。
- 16 秒视觉窗口是较优点：足够覆盖近期动作，同时不会显著增加计算。
- 文本 token 的 sink 和 window 保留策略对长程连贯性很重要。

### 数据和训练策略
仅使用 Live-WhisperX-526K 的效果有限；加入 Inf-Streams-Train 后，长视频流式能力大幅提升；再加入高质量 annealing 数据后，解说质量和 VQA 表现继续增强。非重叠训练策略也弱于 overlapped strategy，证明 **数据本身不够，训练方式也必须匹配推理形态**。

## 我的理解与启发
这篇论文最值得借鉴的是系统设计视角：它没有把 “无限视频理解” 简化成单个长上下文技巧，而是同时处理了四个约束：

1. **计算约束**：通过 KV 复用和固定窗口避免重复计算。
2. **记忆约束**：文本和视觉使用不同保留策略，符合多模态信息的时间尺度差异。
3. **分布约束**：contiguous RoPE 避免位置编码超出训练分布。
4. **监督约束**：重叠 chunk 训练让短上下文 SFT 学到流式推理模式。

对实际产品也有启发：如果要做实时助手、机器人或自动驾驶场景的多模态 Agent，不能只追求模型输入更长；更重要的是设计稳定、低延迟、可持续运行的在线状态表示。

## 局限与待观察点
- 主要数据来自体育解说，迁移到开放世界监控、机器人或车载场景仍需验证。
- GPT-5 作为评审器带来可扩展性，但也可能引入 judge 偏差。
- 论文强调 8 FPS 与单 H100，端侧或低成本部署还需要进一步压缩。
- 模型长期输出中的事实一致性、安全性和可控性仍是产品化挑战。

## 结论
StreamingVLM 给出了一个务实路线：用 **attention sink + 文本长窗口 + 视觉短窗口 + KV 复用 + contiguous RoPE + overlapped SFT**，把已有 VLM 改造成可实时处理近无限视频流的系统。它的贡献不仅是性能指标，更是把训练、推理和数据闭环对齐的工程范式。

    const state = {
      activeCategory: "全部",
      query: "",
      activeNoteId: new URLSearchParams(location.search).get("note") || NOTES[0].id
    };

    const elements = {
      themeToggle: document.querySelector("#themeToggle"),
      searchInput: document.querySelector("#searchInput"),
      categoryList: document.querySelector("#categoryList"),
      noteList: document.querySelector("#noteList"),
      noteCount: document.querySelector("#noteCount"),
      stats: document.querySelector("#stats"),
      articleHeader: document.querySelector("#articleHeader"),
      articleBody: document.querySelector("#articleBody"),
      tocList: document.querySelector("#tocList")
    };

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function slugify(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/[^\p{Letter}\p{Number}]+/gu, "-")
        .replace(/^-+|-+$/g, "") || "section";
    }

    function inlineMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
    }

    function renderMarkdown(markdown) {
      const lines = markdown.trim().split("\n");
      const html = [];
      let paragraph = [];
      let listOpen = false;
      let passthrough = false;

      function closeParagraph() {
        if (paragraph.length) {
          html.push(`<p>${inlineMarkdown(paragraph.join(" ").trim())}</p>`);
          paragraph = [];
        }
      }

      function closeList() {
        if (listOpen) {
          html.push("</ul>");
          listOpen = false;
        }
      }

      for (const rawLine of lines) {
        const line = rawLine.trimEnd();
        const trimmed = line.trim();

        if (trimmed.startsWith("<") || passthrough) {
          closeParagraph();
          closeList();
          html.push(line);
          passthrough = !(trimmed.endsWith(">") && !trimmed.includes("<table") && !trimmed.includes("<figure") && !trimmed.includes("<div"));
          if (trimmed.includes("</table>") || trimmed.includes("</figure>") || trimmed.includes("</div>")) {
            passthrough = false;
          }
          continue;
        }

        if (!trimmed) {
          closeParagraph();
          closeList();
          continue;
        }

        const headingMatch = trimmed.match(/^(#{2,3})\s+(.+)$/);
        if (headingMatch) {
          closeParagraph();
          closeList();
          const level = headingMatch[1].length;
          const headingText = inlineMarkdown(headingMatch[2]);
          const id = slugify(headingMatch[2]);
          html.push(`<h${level} id="${id}">${headingText}</h${level}>`);
          continue;
        }

        if (trimmed.startsWith("- ")) {
          closeParagraph();
          if (!listOpen) {
            html.push("<ul>");
            listOpen = true;
          }
          html.push(`<li>${inlineMarkdown(trimmed.slice(2))}</li>`);
          continue;
        }

        if (trimmed.startsWith("> ")) {
          closeParagraph();
          closeList();
          html.push(`<blockquote>${inlineMarkdown(trimmed.slice(2))}</blockquote>`);
          continue;
        }

        paragraph.push(trimmed);
      }

      closeParagraph();
      closeList();
      return html.join("\n");
    }

    function getCategories() {
      return ["全部", ...Array.from(new Set(NOTES.map(note => note.category)))];
    }

    function getFilteredNotes() {
      const normalizedQuery = state.query.trim().toLowerCase();
      return NOTES.filter(note => {
        const categoryMatched = state.activeCategory === "全部" || note.category === state.activeCategory;
        const searchable = [note.title, note.summary, note.category, note.tags.join(" "), note.content].join(" ").toLowerCase();
        return categoryMatched && (!normalizedQuery || searchable.includes(normalizedQuery));
      });
    }

    function renderStats() {
      const categories = new Set(NOTES.map(note => note.category));
      const tags = new Set(NOTES.flatMap(note => note.tags));
      elements.stats.innerHTML = `
        <div class="stat"><strong>${NOTES.length}</strong><span>篇笔记</span></div>
        <div class="stat"><strong>${categories.size}</strong><span>个分类</span></div>
        <div class="stat"><strong>${tags.size}</strong><span>个标签</span></div>
      `;
    }

    function renderCategories() {
      elements.categoryList.innerHTML = getCategories().map(category => `
        <button class="chip ${category === state.activeCategory ? "active" : ""}" type="button" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>
      `).join("");
    }

    function renderNoteList() {
      const filteredNotes = getFilteredNotes();
      elements.noteCount.textContent = `${filteredNotes.length}/${NOTES.length}`;

      if (!filteredNotes.length) {
        elements.noteList.innerHTML = '<div class="empty-state">没有匹配的笔记</div>';
        return;
      }

      elements.noteList.innerHTML = filteredNotes.map(note => `
        <button class="note-card ${note.id === state.activeNoteId ? "active" : ""}" type="button" data-note-id="${note.id}">
          <div class="meta-row"><span>${escapeHtml(note.category)}</span><span>·</span><span>${escapeHtml(note.date)}</span><span>·</span><span>${escapeHtml(note.readTime)}</span></div>
          <h3>${escapeHtml(note.title)}</h3>
          <p>${escapeHtml(note.summary)}</p>
          <div class="tag-row">${note.tags.slice(0, 3).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
        </button>
      `).join("");
    }

    function renderArticle() {
      const filteredNotes = getFilteredNotes();
      let note = NOTES.find(item => item.id === state.activeNoteId);
      if (!filteredNotes.some(item => item.id === state.activeNoteId)) {
        note = filteredNotes[0] || NOTES[0];
        state.activeNoteId = note.id;
      }

      history.replaceState(null, "", `?note=${encodeURIComponent(note.id)}`);
      document.title = `${note.title} · 屿佳的笔记博客`;

      elements.articleHeader.innerHTML = `
        <div class="meta-row"><span>${escapeHtml(note.category)}</span><span>·</span><span>${escapeHtml(note.date)}</span><span>·</span><span>${escapeHtml(note.readTime)}</span></div>
        <h1>${escapeHtml(note.title)}</h1>
        <p class="article-summary">${escapeHtml(note.summary)}</p>
        <div class="tag-row">${note.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
      `;
      elements.articleBody.innerHTML = renderMarkdown(note.content);
      renderToc();
    }

    function renderToc() {
      const headings = elements.articleBody.querySelectorAll("h2, h3");
      if (!headings.length) {
        elements.tocList.innerHTML = '<li class="empty-state">暂无目录</li>';
        return;
      }

      elements.tocList.innerHTML = Array.from(headings).map(heading => `
        <li><a class="toc-${heading.tagName.toLowerCase()}" href="#${heading.id}">${heading.textContent}</a></li>
      `).join("");
    }

    function render() {
      renderStats();
      renderCategories();
      renderNoteList();
      renderArticle();
    }

    function bindEvents() {
      elements.searchInput.addEventListener("input", event => {
        state.query = event.target.value;
        renderNoteList();
        renderArticle();
      });

      elements.categoryList.addEventListener("click", event => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        state.activeCategory = button.dataset.category;
        renderCategories();
        renderNoteList();
        renderArticle();
      });

      elements.noteList.addEventListener("click", event => {
        const button = event.target.closest("[data-note-id]");
        if (!button) return;
        state.activeNoteId = button.dataset.noteId;
        renderNoteList();
        renderArticle();
        window.scrollTo({ top: document.querySelector(".layout").offsetTop - 80, behavior: "smooth" });
      });

      elements.themeToggle.addEventListener("click", () => {
        const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme;
        localStorage.setItem("notes-theme", nextTheme);
        elements.themeToggle.textContent = nextTheme === "dark" ? "浅色" : "深色";
      });
    }

    function initTheme() {
      const savedTheme = localStorage.getItem("notes-theme");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = savedTheme || (prefersDark ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
      elements.themeToggle.textContent = theme === "dark" ? "浅色" : "深色";
    }

    initTheme();
    bindEvents();
    render();
  </script>
