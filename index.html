<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="一个现代化静态笔记博客，收录论文阅读、技术笔记与长期知识库。" />
  <title>屿佳的笔记博客</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="#" aria-label="返回首页">
        <span class="brand-mark">N</span>
        <span>Notes Lab</span>
      </a>
      <nav class="nav-actions" aria-label="站点操作">
        <a class="ghost-btn hide-mobile" href="https://github.com/Cameron274365/Cameron274365.github.io" target="_blank" rel="noreferrer">GitHub</a>
        <button class="ghost-btn" id="themeToggle" type="button">深色</button>
        <a class="primary-btn" href="#notes">开始阅读</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section class="hero" aria-label="博客简介">
      <div class="hero-card">
        <span class="eyebrow">✨ Static Knowledge Base · Paper Notes · Research Radar</span>
        <h1>把论文、想法和工程经验沉淀成<span class="gradient-text">可检索的笔记系统</span></h1>
        <p>这是一个纯静态、无需构建工具的现代化笔记博客。左侧是目录与分类，正文自动生成文章内大纲；新增笔记时，只需要在 <code>notes-data.js</code> 的 <code>NOTES</code> 数组中追加一条记录。</p>
        <div class="stats" id="stats"></div>
      </div>

      <aside class="panel quick-panel" aria-label="搜索和分类">
        <h2>快速定位</h2>
        <label class="search-box" for="searchInput">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="搜索标题、摘要、标签或正文..." />
        </label>
        <div class="category-list" id="categoryList"></div>
      </aside>
    </section>

    <section class="layout" id="notes">
      <aside class="panel sidebar" aria-label="笔记列表">
        <div class="section-title">
          <span>Notes</span>
          <span id="noteCount"></span>
        </div>
        <div class="note-list" id="noteList"></div>
      </aside>

      <article class="panel article" aria-live="polite">
        <header class="article-header" id="articleHeader"></header>
        <div class="article-body" id="articleBody"></div>
      </article>

      <aside class="panel toc-panel" aria-label="文章目录">
        <div class="section-title">On this page</div>
        <ol class="toc-list" id="tocList"></ol>
      </aside>
    </section>
  </main>

  <footer class="footer">
    <div class="shell">Built as a static blog. Update notes in <code>notes-data.js</code> → <code>NOTES</code>.</div>
  </footer>

  <script src="notes-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
