<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="一个现代化静态笔记博客，收录论文阅读、技术笔记与长期知识库。" />
  <meta name="author" content="Cameron" />
  <meta name="theme-color" content="#6d5dfc" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="屿佳的笔记博客" />
  <meta property="og:description" content="一个现代化静态笔记博客，收录论文阅读、技术笔记与长期知识库。" />
  <meta property="og:url" content="https://cameron274365.github.io/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://cameron274365.github.io/" />
  <title>屿佳的笔记博客</title>
  <link rel="stylesheet" href="styles.css?v=20260724-build" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"], ["$", "$"]],
        displayMath: [["\\[", "\\]"], ["$$", "$$"]],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <!-- ===== TOPBAR ===== -->
  <header class="topbar">
    <div class="shell topbar-inner">
      <button class="sidebar-toggle hide-desktop" id="sidebarToggle" type="button" aria-label="打开目录">
        <span class="hamburger-icon"></span>
      </button>
      <a class="brand" href="#" aria-label="返回首页">
        <span class="brand-mark">N</span>
        <span class="brand-name">Notes Lab</span>
      </a>
      <label class="search-box topbar-search" for="searchInput">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索标题、摘要、标签..." />
      </label>
      <nav class="nav-actions" aria-label="站点操作">
        <a class="ghost-btn hide-mobile" href="https://github.com/Cameron274365/Cameron274365.github.io" target="_blank" rel="noreferrer">GitHub</a>
        <button class="ghost-btn theme-toggle" id="themeToggle" type="button" aria-label="切换主题">
          <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
          <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- ===== SIDEBAR BACKDROP ===== -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="shell layout-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="笔记列表">
      <div class="sidebar-header">
        <div class="section-title">
          <span>Notes</span>
          <span id="noteCount"></span>
        </div>
        <div class="category-chips" id="categoryList"></div>
      </div>
      <div class="note-list" id="noteList"></div>
    </aside>

    <!-- Article -->
    <article class="article-panel" aria-live="polite">
      <div class="article-content">
        <header class="article-meta-header" id="articleHeader"></header>
        <div class="article-body" id="articleBody"></div>
      </div>
      <!-- Mobile TOC FAB -->
      <button class="toc-fab hide-desktop" id="tocFab" type="button" aria-label="文章目录">
        <span aria-hidden="true">≡</span>
      </button>
      <!-- Mobile TOC overlay -->
      <div class="toc-overlay hide-desktop" id="tocOverlay">
        <div class="toc-overlay-header">
          <span>On this page</span>
          <button class="toc-overlay-close" id="tocOverlayClose" type="button" aria-label="关闭目录">✕</button>
        </div>
        <ul class="toc-list" id="tocListMobile"></ul>
      </div>
    </article>

    <!-- Desktop TOC rail -->
    <aside class="toc-rail hide-mobile-tablet" aria-label="文章目录">
      <div class="toc-sticky">
        <div class="section-title">On this page</div>
        <ul class="toc-list" id="tocListDesktop"></ul>
      </div>
    </aside>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="shell footer-inner">
      <div class="footer-stats" id="stats"></div>
      <div class="footer-text">Built as a static blog. Update Markdown notes in <code>notes/</code>, then run <code>node scripts/build-notes.js</code>.</div>
    </div>
  </footer>

  <script>
    const assetVersion = Date.now().toString();

    function loadScript(src, onload) {
      const script = document.createElement("script");
      script.src = `${src}?v=${assetVersion}`;
      script.onload = onload;
      document.body.appendChild(script);
    }

    loadScript("notes-data.js", () => loadScript("app.js"));
  </script>
</body>
</html>
